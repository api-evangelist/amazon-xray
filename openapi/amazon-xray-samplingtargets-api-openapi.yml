security:
- hmac: []
tags:
- name: SamplingTargets
paths:
  /SamplingTargets:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetSamplingTargets
      description: 'Requests a sampling quota for rules that the service is using to sample requests. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSamplingTargetsResult'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottledException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - SamplingStatisticsDocuments
              properties:
                SamplingStatisticsDocuments:
                  description: Information about rules that the service is using to sample requests.
                  type: array
                  items:
                    $ref: '#/components/schemas/SamplingStatisticsDocument'
                  maxItems: 25
      summary: Amazon X-Ray Get Sampling Targets
      tags:
      - SamplingTargets
components:
  schemas:
    BorrowCount:
      type: integer
      minimum: 0
    GetSamplingTargetsResult:
      type: object
      properties:
        SamplingTargetDocuments:
          allOf:
          - $ref: '#/components/schemas/SamplingTargetDocumentList'
          - description: Updated rules that the service should use to sample requests.
        LastRuleModification:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The last time a user changed the sampling rule configuration. If the sampling rule configuration changed since the service last retrieved it, the service should call <a href="https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingRules.html">GetSamplingRules</a> to get the latest version.
        UnprocessedStatistics:
          allOf:
          - $ref: '#/components/schemas/UnprocessedStatisticsList'
          - description: Information about <a href="https://docs.aws.amazon.com/xray/latest/api/API_SamplingStatisticsDocument.html">SamplingStatisticsDocument</a> that X-Ray could not process.
    UnprocessedStatistics:
      type: object
      properties:
        RuleName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the sampling rule.
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The error code.
        Message:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The error message.
      description: Sampling statistics from a call to <a href="https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingTargets.html">GetSamplingTargets</a> that X-Ray could not process.
    String:
      type: string
    NullableInteger:
      type: integer
    SamplingTargetDocument:
      type: object
      properties:
        RuleName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the sampling rule.
        FixedRate:
          allOf:
          - $ref: '#/components/schemas/Double'
          - description: The percentage of matching requests to instrument, after the reservoir is exhausted.
        ReservoirQuota:
          allOf:
          - $ref: '#/components/schemas/NullableInteger'
          - description: The number of requests per second that X-Ray allocated for this service.
        ReservoirQuotaTTL:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: When the reservoir quota expires.
        Interval:
          allOf:
          - $ref: '#/components/schemas/NullableInteger'
          - description: The number of seconds for the service to wait before getting sampling targets again.
      description: Temporary changes to a sampling rule configuration. To meet the global sampling target for a rule, X-Ray calculates a new reservoir for each service based on the recent sampling results of all services that called <a href="https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingTargets.html">GetSamplingTargets</a>.
    RuleName:
      type: string
      minLength: 1
      maxLength: 32
    SamplingStatisticsDocument:
      type: object
      required:
      - RuleName
      - ClientID
      - Timestamp
      - RequestCount
      - SampledCount
      properties:
        RuleName:
          allOf:
          - $ref: '#/components/schemas/RuleName'
          - description: The name of the sampling rule.
        ClientID:
          allOf:
          - $ref: '#/components/schemas/ClientID'
          - description: A unique identifier for the service in hexadecimal.
        Timestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The current time.
        RequestCount:
          allOf:
          - $ref: '#/components/schemas/RequestCount'
          - description: The number of requests that matched the rule.
        SampledCount:
          allOf:
          - $ref: '#/components/schemas/SampledCount'
          - description: The number of requests recorded.
        BorrowCount:
          allOf:
          - $ref: '#/components/schemas/BorrowCount'
          - description: The number of requests recorded with borrowed reservoir quota.
      description: Request sampling results for a single rule from a service. Results are for the last 10 seconds unless the service has been assigned a longer reporting interval after a previous call to <a href="https://docs.aws.amazon.com/xray/latest/api/API_GetSamplingTargets.html">GetSamplingTargets</a>.
    Double:
      type: number
      format: double
    RequestCount:
      type: integer
      minimum: 0
    ClientID:
      type: string
      minLength: 24
      maxLength: 24
    SamplingTargetDocumentList:
      type: array
      items:
        $ref: '#/components/schemas/SamplingTargetDocument'
    ThrottledException: {}
    InvalidRequestException: {}
    Timestamp:
      type: string
      format: date-time
    UnprocessedStatisticsList:
      type: array
      items:
        $ref: '#/components/schemas/UnprocessedStatistics'
    SampledCount:
      type: integer
      minimum: 0
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
