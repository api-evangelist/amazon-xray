  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The AWS X-Ray endpoint for China (Beijing) and China (Ningxia)
- url: https://xray.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The AWS X-Ray endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: SamplingStatisticSummaries
paths:
  /SamplingStatisticSummaries:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetSamplingStatisticSummaries
      description: Retrieves information about recent sampling results for all sampling rules.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSamplingStatisticSummariesResult'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottledException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledException'
      parameters:
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NextToken:
                  description: Pagination token.
                  type: string
      summary: Amazon X-Ray Get Sampling Statistic Summaries
      tags:
      - SamplingStatisticSummaries
components:
  schemas:
    SamplingStatisticSummary:
      type: object
      properties:
        RuleName:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The name of the sampling rule.
        Timestamp:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The start time of the reporting window.
        RequestCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of requests that matched the rule.
        BorrowCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of requests recorded with borrowed reservoir quota.
        SampledCount:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: The number of requests recorded.
      description: Aggregated request sampling data for a sampling rule across all services for a 10-second window.
    String:
      type: string
    InvalidRequestException: {}
    SamplingStatisticSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/SamplingStatisticSummary'
    GetSamplingStatisticSummariesResult:
      type: object
      properties:
        SamplingStatisticSummaries:
          allOf:
          - $ref: '#/components/schemas/SamplingStatisticSummaryList'
          - description: Information about the number of requests instrumented for each sampling rule.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Pagination token.
    Integer:
      type: integer
    ThrottledException: {}
    Timestamp:
      type: string
      format: date-time
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/xray/
