  /TraceSummaries:
    post:
      operationId: GetTraceSummaries
      summary: Amazon X-Ray Get trace summaries
      description: Retrieves IDs and annotations for traces available for a specified time frame using an optional filter.
      tags:
      - Traces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - StartTime
              - EndTime
              properties:
                StartTime:
                  type: string
                  format: date-time
                EndTime:
                  type: string
                  format: date-time
                FilterExpression:
                  type: string
                Sampling:
                  type: boolean
                NextToken:
                  type: string
      responses:
        '200':
          description: Successful response.
      security:
      - aws_sig_v4: []
    servers:
    - url: https://xray.{region}.amazonaws.com
      description: AWS X-Ray regional endpoint
      variables:
        region:
          default: us-east-1
          description: AWS region
          enum:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
