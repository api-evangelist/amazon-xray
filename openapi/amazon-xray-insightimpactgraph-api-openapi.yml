security:
- hmac: []
tags:
- name: InsightImpactGraph
paths:
  /InsightImpactGraph:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetInsightImpactGraph
      description: Retrieves a service graph structure filtered by the specified insight. The service graph is limited to only structural information. For a complete service graph, use this API with the GetServiceGraph API.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInsightImpactGraphResult'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottledException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - InsightId
              - StartTime
              - EndTime
              properties:
                InsightId:
                  description: The insight's unique identifier. Use the GetInsightSummaries action to retrieve an InsightId.
                  type: string
                  pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}'
                StartTime:
                  description: The estimated start time of the insight, in Unix time seconds. The StartTime is inclusive of the value provided and can't be more than 30 days old.
                  type: string
                  format: date-time
                EndTime:
                  description: 'The estimated end time of the insight, in Unix time seconds. The EndTime is exclusive of the value provided. The time range between the start time and end time can''t be more than six hours. '
                  type: string
                  format: date-time
                NextToken:
                  description: 'Specify the pagination token returned by a previous request to retrieve the next page of results. '
                  type: string
                  minLength: 1
                  maxLength: 2000
      summary: Amazon X-Ray Get Insight Impact Graph
      tags:
      - InsightImpactGraph
components:
  schemas:
    InsightImpactGraphService:
      type: object
      properties:
        ReferenceId:
          allOf:
          - $ref: '#/components/schemas/NullableInteger'
          - description: Identifier for the service. Unique within the service map.
        Type:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>Identifier for the service. Unique within the service map.</p> <ul> <li> <p>Amazon Web Services Resource - The type of an Amazon Web Services resource. For example, AWS::EC2::Instance for an application running on Amazon EC2 or AWS::DynamoDB::Table for an Amazon DynamoDB table that the application used. </p> </li> <li> <p>Amazon Web Services Service - The type of an Amazon Web Services service. For example, AWS::DynamoDB for downstream calls to Amazon DynamoDB that didn't target a specific table. </p> </li> <li> <p>Amazon Web Services Service - The type of an Amazon Web Services service. For example, AWS::DynamoDB for downstream calls to Amazon DynamoDB that didn't target a specific table. </p> </li> <li> <p>remote - A downstream service of indeterminate type.</p> </li> </ul>
        Name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The canonical name of the service.
        Names:
          allOf:
          - $ref: '#/components/schemas/ServiceNames'
          - description: A list of names for the service, including the canonical name.
        AccountId:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Identifier of the Amazon Web Services account in which the service runs.
        Edges:
          allOf:
          - $ref: '#/components/schemas/InsightImpactGraphEdgeList'
          - description: Connections to downstream services.
      description: 'Information about an application that processed requests, users that made requests, or downstream services, resources, and applications that an application used. '
    ServiceNames:
      type: array
      items:
        $ref: '#/components/schemas/String'
    InsightImpactGraphServiceList:
      type: array
      items:
        $ref: '#/components/schemas/InsightImpactGraphService'
    InvalidRequestException: {}
    InsightId:
      type: string
      pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}'
    GetInsightImpactGraphResult:
      type: object
      properties:
        InsightId:
          allOf:
          - $ref: '#/components/schemas/InsightId'
          - description: The insight's unique identifier.
        StartTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The provided start time.
        EndTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: 'The provided end time. '
        ServiceGraphStartTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time, in Unix seconds, at which the service graph started.
        ServiceGraphEndTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time, in Unix seconds, at which the service graph ended.
        Services:
          allOf:
          - $ref: '#/components/schemas/InsightImpactGraphServiceList'
          - description: The Amazon Web Services instrumented services related to the insight.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/Token'
          - description: Pagination token.
    ThrottledException: {}
    Timestamp:
      type: string
      format: date-time
    InsightImpactGraphEdge:
      type: object
      properties:
        ReferenceId:
          allOf:
          - $ref: '#/components/schemas/NullableInteger'
          - description: Identifier of the edge. Unique within a service map.
      description: The connection between two service in an insight impact graph.
    NullableInteger:
      type: integer
    Token:
      type: string
      minLength: 1
      maxLength: 2000
    String:
      type: string
    InsightImpactGraphEdgeList:
      type: array
      items:
        $ref: '#/components/schemas/InsightImpactGraphEdge'
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
