  description: The AWS X-Ray endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: ListResourcePolicies
paths:
  /ListResourcePolicies:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListResourcePolicies
      description: Returns the list of resource policies in the target Amazon Web Services account.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResourcePoliciesResult'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ThrottledException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledException'
      parameters:
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NextToken:
                  description: Not currently supported.
                  type: string
                  minLength: 1
                  maxLength: 100
      summary: Amazon X-Ray List Resource Policies
      tags:
      - ListResourcePolicies
components:
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourcePolicyNextToken:
      type: string
      minLength: 1
      maxLength: 100
    InvalidRequestException: {}
    ResourcePolicyList:
      type: array
      items:
        $ref: '#/components/schemas/ResourcePolicy'
    ResourcePolicy:
      type: object
      properties:
        PolicyName:
          allOf:
          - $ref: '#/components/schemas/PolicyName'
          - description: The name of the resource policy. Must be unique within a specific Amazon Web Services account.
        PolicyDocument:
          allOf:
          - $ref: '#/components/schemas/PolicyDocument'
          - description: The resource policy document, which can be up to 5kb in size.
        PolicyRevisionId:
          allOf:
          - $ref: '#/components/schemas/PolicyRevisionId'
          - description: Returns the current policy revision id for this policy name.
        LastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: When the policy was last updated, in Unix time seconds.
      description: A resource policy grants one or more Amazon Web Services services and accounts permissions to access X-Ray. Each resource policy is associated with a specific Amazon Web Services account.
    PolicyRevisionId:
      type: string
    ThrottledException: {}
    Timestamp:
      type: string
      format: date-time
    PolicyName:
      type: string
      pattern: '[\w+=,.@-]+'
      minLength: 1
      maxLength: 128
    ListResourcePoliciesResult:
      type: object
      properties:
        ResourcePolicies:
          allOf:
          - $ref: '#/components/schemas/ResourcePolicyList'
          - description: The list of resource policies in the target Amazon Web Services account.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/ResourcePolicyNextToken'
          - description: Pagination token. Not currently supported.
    PolicyDocument:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/xray/
