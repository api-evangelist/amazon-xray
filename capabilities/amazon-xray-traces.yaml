naftiko: 1.0.0-alpha2
info:
  label: Amazon X-Ray API — Traces
  description: 'Amazon X-Ray API — Traces. 2 operations. Lead operation: Amazon X-Ray Get trace summaries. Self-contained
    Naftiko capability covering one Amazon Xray business surface.'
  tags:
  - Amazon Xray
  - Traces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_XRAY_API_KEY: AMAZON_XRAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-xray-traces
    baseUri: https://xray.{region}.amazonaws.com
    description: Amazon X-Ray API — Traces business capability. Self-contained, no shared references.
    resources:
    - name: TraceSummaries
      path: /TraceSummaries
      operations:
      - name: gettracesummaries
        method: POST
        description: Amazon X-Ray Get trace summaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: Traces
      path: /Traces
      operations:
      - name: puttracesegments
        method: POST
        description: Amazon X-Ray Upload trace segments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_XRAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-xray-traces-rest
    port: 8080
    description: REST adapter for Amazon X-Ray API — Traces. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/tracesummaries
      name: tracesummaries
      description: REST surface for TraceSummaries.
      operations:
      - method: POST
        name: gettracesummaries
        description: Amazon X-Ray Get trace summaries
        call: amazon-xray-traces.gettracesummaries
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/traces
      name: traces
      description: REST surface for Traces.
      operations:
      - method: POST
        name: puttracesegments
        description: Amazon X-Ray Upload trace segments
        call: amazon-xray-traces.puttracesegments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-xray-traces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon X-Ray API — Traces. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: amazon-x-ray-get-trace
      description: Amazon X-Ray Get trace summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-xray-traces.gettracesummaries
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-x-ray-upload-trace
      description: Amazon X-Ray Upload trace segments
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-xray-traces.puttracesegments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
