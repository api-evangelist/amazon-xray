naftiko: 1.0.0-alpha2
info:
  label: Amazon X-Ray API — Groups
  description: 'Amazon X-Ray API — Groups. 1 operations. Lead operation: Amazon X-Ray Get groups. Self-contained Naftiko capability
    covering one Amazon Xray business surface.'
  tags:
  - Amazon Xray
  - Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_XRAY_API_KEY: AMAZON_XRAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-xray-groups
    baseUri: https://xray.{region}.amazonaws.com
    description: Amazon X-Ray API — Groups business capability. Self-contained, no shared references.
    resources:
    - name: Groups
      path: /Groups
      operations:
      - name: getgroups
        method: POST
        description: Amazon X-Ray Get groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_XRAY_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-xray-groups-rest
    port: 8080
    description: REST adapter for Amazon X-Ray API — Groups. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/groups
      name: groups
      description: REST surface for Groups.
      operations:
      - method: POST
        name: getgroups
        description: Amazon X-Ray Get groups
        call: amazon-xray-groups.getgroups
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-xray-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon X-Ray API — Groups. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: amazon-x-ray-get-groups
      description: Amazon X-Ray Get groups
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-xray-groups.getgroups
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
