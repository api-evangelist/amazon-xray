aid: amazon-xray
name: Amazon X-Ray
description: >-
  AWS X-Ray is a distributed tracing service that helps developers analyze and debug production applications, providing
  end-to-end visibility into requests as they travel through the application. X-Ray provides service maps, trace
  analysis, sampling rules, group filtering, and AI-powered insights for identifying performance bottlenecks and errors
  across microservices and serverless architectures.
